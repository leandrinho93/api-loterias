<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Bolão – Estratégia Loteria</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0d0d14;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #16161f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #eab308;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 { color: #eab308; margin: 0 0 10px; font-family: 'Syne', sans-serif; font-size: 1.4rem; }
        p { color: #a1a1aa; font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
        
        #detalhesBolao {
            display: none;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.85rem;
        }
        .jogo-badge {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: block;
        }

        .btn {
            display: inline-block;
            background: #7c5cfc;
            color: #fff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background: #6b4fe0; }
        .icon-top { font-size: 3.5rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-top" id="iconTop"></div>
        <div class="spinner" id="spinner"></div>
        
        <h2 id="titulo">Preparando Bolão...</h2>
        <p id="mensagem">Buscando os dados do sorteio, aguarde um instante.</p>
        
        <div id="detalhesBolao"></div>
        <div id="extraButtons"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGrLhUWntveHvJ9TFZRDkMhGi1sqYKrz0",
            authDomain: "estacao-de-comando-loteria.firebaseapp.com",
            databaseURL: "https://estacao-de-comando-loteria-default-rtdb.firebaseio.com",
            projectId: "estacao-de-comando-loteria",
            storageBucket: "estacao-de-comando-loteria.firebasestorage.app",
            messagingSenderId: "115426303577",
            appId: "1:115426303577:web:31cfc1f3d77fde3be71b48"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const LINK_PORTFOLIO = "https://leandrinho93.github.io/lmtr/";

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        window.jogosParaCopiar = []; // Guarda os jogos decodificados para o botão usar

        window.copiarJogos = function() {
            const texto = window.jogosParaCopiar.join('\n');
            navigator.clipboard.writeText(texto).then(() => {
                let btn = document.getElementById('btnCopiarJogos');
                if(btn) {
                    btn.textContent = 'Copiado! ✓';
                    setTimeout(() => { btn.textContent = '📋 Copiar Jogos'; }, 2500);
                }
            }).catch(() => {
                let temp = document.createElement('textarea');
                temp.value = texto;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                alert('Jogos copiados com sucesso!');
            });
        };
		
		// Função do botão de Copiar o PIX
        window.copiarPix = function(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                let btn = document.getElementById('btnCopiarPix');
                if(btn) {
                    btn.textContent = 'Copiado! ✓';
                    btn.style.background = '#4ade80';
                    btn.style.color = '#0d0d14';
                    btn.style.borderColor = '#4ade80';
                    setTimeout(() => {
                        btn.textContent = 'Copiar';
                        btn.style.background = 'rgba(250, 204, 21, 0.2)';
                        btn.style.color = '#facc15';
                        btn.style.borderColor = '#facc15';
                    }, 2500);
                }
            }).catch(e => {
                // Fallback para celulares mais antigos
                let temp = document.createElement('textarea');
                temp.value = texto;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                alert('Chave PIX copiada com sucesso!');
            });
        };

        // --- DECODIFICADOR INTEGRADO ---
        function decodificarBolao(codigoStr) {
            let cleanCode = codigoStr.trim();
            if (!cleanCode.startsWith('LMTR-')) return { erro: true };
            
            let base64Part = cleanCode.replace('LMTR-', '');
            try {
                let decodeUnicode = (str) => decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                let decodedRaw = decodeUnicode(base64Part);

                let payload = {};
                if (decodedRaw.includes('{"l":')) {
                    let json = JSON.parse(decodedRaw);
                    payload = { loteria: json.l, concurso: json.c, responsavel: 'Desconhecido', cotas: 1, pix: 'Não embutido', nomes: [], valorCota: 'A apurar', jogos: json.j };
                } else {
                    let parts = decodedRaw.split(':');
                    if (parts.length >= 8) {
                        // FORMATO NOVO COM VALOR DA COTA
                        payload = { loteria: parts[0], concurso: parts[1] || 'Atual', responsavel: parts[2], cotas: parseInt(parts[3]) || 1, pix: parts[4], nomes: parts[5].split(','), valorCota: parts[6], jogos: parts[7].split('~') };
                    } else if (parts.length >= 7) {
                        payload = { loteria: parts[0], concurso: parts[1] || 'Atual', responsavel: parts[2], cotas: parseInt(parts[3]) || 1, pix: parts[4], nomes: parts[5].split(','), valorCota: 'A apurar', jogos: parts[6].split('~') };
                    } else if (parts.length >= 5) {
                        payload = { loteria: parts[0], concurso: parts[1] || 'Atual', responsavel: parts[2], cotas: parseInt(parts[3]) || 1, pix: 'Não embutido', nomes: [], valorCota: 'A apurar', jogos: parts[4].split('~') };
                    } else if (parts.length === 4) {
                        payload = { loteria: parts[0], concurso: parts[1] || 'Atual', responsavel: parts[2], cotas: 1, pix: 'Não embutido', nomes: [], valorCota: 'A apurar', jogos: parts[3].split('~') };
                    } else {
                        payload = { loteria: parts[0], concurso: parts[1] || 'Atual', responsavel: 'Desconhecido', cotas: 1, pix: 'Não embutido', nomes: [], valorCota: 'A apurar', jogos: parts[2].split('~') };
                    }
                }
                return { sucesso: true, ...payload };
            } catch (e) {
                return { erro: true };
            }
        }

        async function iniciar() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const codigoDireto = params.get('codigo');

            if (id) {
                try {
                    const snapshot = await database.ref('boloes_compartilhados/' + id).once('value');
                    const dados = snapshot.val();

                    if (dados && dados.codigo) {
                        analisarEEncaminhar(dados.codigo);
                    } else {
                        mostrarErro('Bolão não encontrado ou o link expirou (validade de 5 dias).');
                    }
                } catch(e) {
                    mostrarErro('Erro de conexão ao buscar o bolão.');
                }
            } else if (codigoDireto) {
                analisarEEncaminhar(codigoDireto);
            } else {
                mostrarErro('Nenhum bolão detectado neste link.');
            }
        }

        function analisarEEncaminhar(codigo) {
            document.getElementById('spinner').style.display = 'none';

            const titulo = document.getElementById('titulo');
            const mensagem = document.getElementById('mensagem');
            const detalhesBolao = document.getElementById('detalhesBolao');
            const iconTop = document.getElementById('iconTop');
            const extraButtons = document.getElementById('extraButtons');

            // Decodifica e monta o painel visual
            const dados = decodificarBolao(codigo);
			if (dados.sucesso) window.jogosParaCopiar = dados.jogos;
            if (dados.sucesso) {
                let nomesHtml = dados.nomes.length > 0 && dados.nomes[0] !== ""
                    ? dados.nomes.map(n => `<span style="background:#333; padding:2px 8px; border-radius:10px; margin-right:4px; margin-bottom:4px; font-size:0.75rem; display:inline-block;">${n}</span>`).join('') 
                    : '<span style="color:#888;">Não informados</span>';

                let jogosHtml = dados.jogos.map((j, i) => `<span class="jogo-badge"><strong>J${i+1}:</strong> ${j}</span>`).join('');

                detalhesBolao.innerHTML = `
                    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 8px; padding: 12px; margin-bottom: 15px; text-align: left;">
                        <strong style="color: #ef4444; font-size: 0.85rem;">⚠️ AVISO IMPORTANTE</strong>
                        <p style="color: #d4d4d8; font-size: 0.75rem; margin-top: 4px; margin-bottom: 0;">
                            Entre em contato com o realizador do bolão, confirme que a chave PIX é realmente a dele, confirme o nome e os dados. <strong>Não faça esse jogo com desconhecidos, apenas com pessoas de confiança.</strong>
                        </p>
                    </div>

                    <div style="margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
                        <strong style="color: #4ade80; font-size: 1rem;">✅ Dados do Bolão</strong><br><br>
                        
                        <span style="color:#a1a1aa;">Modalidade:</span> <strong style="color:#fff; text-transform: capitalize;">${dados.loteria}</strong><br>
                        <span style="color:#a1a1aa;">Concurso:</span> <strong style="color:#fff;">${dados.concurso}</strong><br>
                        <span style="color:#a1a1aa;">Organizador:</span> <strong style="color:#60a5fa;">${dados.responsavel}</strong><br>
                        <span style="color:#a1a1aa;">Total de Cotas:</span> <strong style="color:#fff;">${dados.cotas}</strong><br>
                        <span style="color:#a1a1aa;">Valor por Cota:</span> <strong style="color:#4ade80;">R$ ${dados.valorCota}</strong><br>
                        
                        <div style="margin-top: 15px;">
                            <span style="color:#a1a1aa;">Chave PIX para pagamento:</span>
                            <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 6px; margin-top: 6px; border: 1px solid rgba(255,255,255,0.1);">
                                <strong style="color: #facc15; font-size: 0.9rem; word-break: break-all;">${dados.pix}</strong>
                                <button id="btnCopiarPix" onclick="copiarPix('${dados.pix}')" style="background: rgba(250, 204, 21, 0.2); border: 1px solid #facc15; color: #facc15; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; transition: 0.2s; flex-shrink: 0; margin-left: 10px;">Copiar</button>
                            </div>
                        </div>

                        <div style="margin-top: 15px;">
                            <span style="color:#a1a1aa;">Participantes:</span><br>
                            <div style="margin-top:6px;">${nomesHtml}</div>
                        </div>
                    </div>

                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 6px;">
                        <span style="color: #EAB308; font-weight: bold;">Jogos Gerados:</span>
                        <button id="btnCopiarJogos" onclick="copiarJogos()" style="background: rgba(234, 179, 8, 0.2); border: 1px solid #eab308; color: #eab308; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.7rem;">📋 Copiar Jogos</button>
                    </div>
                    <div style="max-height: 150px; overflow-y: auto; padding-right: 5px;">
                        ${jogosHtml}
                    </div>

                    <div style="font-size: 0.65rem; color: var(--text-dim); text-align: justify; line-height: 1.5; margin-top: 20px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px;">
                        <strong>O Estratégia Loteria é exclusivamente um software de gestão e análise estatística.</strong> Não vendemos bilhetes, não realizamos apostas, não processamos pagamentos e não temos nenhum vínculo com a Caixa Econômica Federal. O rateio e o pagamento deste bolão são de inteira responsabilidade dos participantes e do organizador.
                    </div>
                `;
                detalhesBolao.style.display = 'block';
            }

            if (isAndroid) {
                // FLUXO NORMAL (ANDROID)
                titulo.textContent = 'Redirecionando...';
                mensagem.innerHTML = 'Abrindo o aplicativo automaticamente.<br><br><small style="color:#71717a;">Você também pode conferir os dados abaixo antes de abrir o app.</small>';

                const deepLink = `intent://importar?codigo=${encodeURIComponent(codigo)}#Intent;scheme=lmtr;package=com.lmtr.SorteadorDeLoteria;end`;
                const playStoreLink = "https://play.google.com/store/apps/details?id=com.lmtr.SorteadorDeLoteria";

                window.location.href = deepLink;

                extraButtons.innerHTML = `<a href="${playStoreLink}" class="btn" style="margin-top: 15px; background: #eab308; color: #0d0d14;">Baixar na Play Store</a>`;

                setTimeout(() => {
                    if (!document.hidden) {
                        window.location.href = playStoreLink;
                    }
                }, 2500);

            } else if (isIOS) {
                // FLUXO IPHONE / IPAD
                iconTop.textContent = '📱';
                iconTop.style.display = 'block';
                titulo.textContent = 'Visualização Web';
                titulo.style.color = '#c084fc';
                mensagem.innerHTML = 'Você está no iOS. Confira os jogos e os dados do bolão diretamente nesta tela!';
                
                extraButtons.innerHTML = `<a href="${LINK_PORTFOLIO}" class="btn" style="margin-top: 10px;">Conhecer a LMTR</a>`;

            } else {
                // FLUXO PC (DESKTOP)
                iconTop.textContent = '💻';
                iconTop.style.display = 'block';
                titulo.textContent = 'Visualização Web';
                titulo.style.color = '#60a5fa';
                mensagem.innerHTML = 'Você está no computador. Confira os dados do seu bolão abaixo.';
                
                extraButtons.innerHTML = `<a href="${LINK_PORTFOLIO}" class="btn" target="_blank" style="margin-top: 10px;">Conhecer a LMTR</a>`;
            }
        }

        function mostrarErro(msg) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('titulo').textContent = 'Ops!';
            document.getElementById('titulo').style.color = '#ef4444';
            document.getElementById('mensagem').textContent = msg;
        }

        setTimeout(iniciar, 300);
    </script>
</body>
</html>
