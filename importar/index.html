<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Bolão – Estratégia Loteria</title>
    <style>
        body {
            background: #0d0d14;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #16161f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #eab308;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 { color: #eab308; margin: 0 0 10px; font-size: 1.3rem; }
        p { color: #a1a1aa; font-size: 0.9rem; line-height: 1.5; margin: 0 0 20px; }
        
        .code-box {
            background: rgba(192,132,252,0.1);
            border: 1px dashed rgba(192,132,252,0.4);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.75rem;
            color: #c084fc;
            word-break: break-all;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="titulo">Preparando Bolão...</h2>
        <p id="mensagem">Buscando os dados do sorteio, aguarde um instante.</p>
        
        <div class="code-box" id="codeBox"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // Configuração real do projeto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAGrLhUWntveHvJ9TFZRDkMhGi1sqYKrz0",
            authDomain: "estacao-de-comando-loteria.firebaseapp.com",
            databaseURL: "https://estacao-de-comando-loteria-default-rtdb.firebaseio.com",
            projectId: "estacao-de-comando-loteria",
            storageBucket: "estacao-de-comando-loteria.firebasestorage.app",
            messagingSenderId: "115426303577",
            appId: "1:115426303577:web:31cfc1f3d77fde3be71b48"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function iniciar() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const codigoDireto = params.get('codigo');

            if (id) {
                // Busca o código completo no Firebase
                try {
                    const snapshot = await database.ref('boloes_compartilhados/' + id).once('value');
                    const dados = snapshot.val();

                    if (dados && dados.codigo) {
                        redirecionarAutomaticamente(dados.codigo);
                    } else {
                        mostrarErro('Bolão não encontrado ou link expirado.');
                    }
                } catch(e) {
                    mostrarErro('Erro de conexão ao buscar o bolão.');
                }
            } else if (codigoDireto) {
                // Compatibilidade com a URL antiga
                redirecionarAutomaticamente(codigoDireto);
            } else {
                mostrarErro('Nenhum bolão detectado neste link.');
            }
        }

        function redirecionarAutomaticamente(codigo) {
            const titulo = document.getElementById('titulo');
            const mensagem = document.getElementById('mensagem');
            const codeBox = document.getElementById('codeBox');

            // Atualiza a interface para indicar a ação
            titulo.textContent = 'Redirecionando...';
            mensagem.innerHTML = 'Abrindo o aplicativo automaticamente.<br><br><small style="color:#71717a;">Se não abrir, baixe o app e cole o código abaixo em <strong>Menu > Importar Bolão por Código</strong>.</small>';
            
            // Exibe o código como plano B visual
            codeBox.textContent = codigo;
            codeBox.style.display = 'block';

            // Monta as rotas de fuga
            const deepLink = `intent://importar?codigo=${encodeURIComponent(codigo)}#Intent;scheme=lmtr;package=com.lmtr.SorteadorDeLoteria;end`;
            const playStoreLink = "https://play.google.com/store/apps/details?id=com.lmtr.SorteadorDeLoteria";

            // 1. Tenta acionar a abertura nativa do App ou da Play Store pelo Chrome
            window.location.href = deepLink;

            // 2. Fallback: Se o usuário estiver num navegador que bloqueia "intent://" 
            // e a tela continuar visível após 2 segundos, força a ida pra Play Store via URL padrão.
            setTimeout(() => {
                if (!document.hidden) {
                    window.location.replace(playStoreLink);
                }
            }, 2000);
        }

        function mostrarErro(msg) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('titulo').textContent = 'Ops!';
            document.getElementById('titulo').style.color = '#ef4444';
            document.getElementById('mensagem').textContent = msg;
        }

        // Dá um fôlego de 300ms para a animação da página rodar antes de travar a thread com o Firebase
        setTimeout(iniciar, 300);
    </script>
</body>
</html>
