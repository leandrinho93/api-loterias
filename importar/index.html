<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Bolão – Estratégia Loteria</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0d0d14;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #16161f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #eab308;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 { color: #eab308; margin: 0 0 10px; font-family: 'Syne', sans-serif; font-size: 1.4rem; }
        p { color: #a1a1aa; font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
        
        .code-box {
            background: rgba(192,132,252,0.1);
            border: 1px dashed rgba(192,132,252,0.4);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.75rem;
            color: #c084fc;
            word-break: break-all;
            margin-bottom: 20px;
            display: none;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-block;
            background: #7c5cfc;
            color: #fff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background: #6b4fe0; }
        .icon-top { font-size: 3.5rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-top" id="iconTop"></div>
        <div class="spinner" id="spinner"></div>
        
        <h2 id="titulo">Preparando Bolão...</h2>
        <p id="mensagem">Buscando os dados do sorteio, aguarde um instante.</p>
        
        <div class="code-box" id="codeBox"></div>
        <div id="extraButtons"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // Configuração real do projeto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAGrLhUWntveHvJ9TFZRDkMhGi1sqYKrz0",
            authDomain: "estacao-de-comando-loteria.firebaseapp.com",
            databaseURL: "https://estacao-de-comando-loteria-default-rtdb.firebaseio.com",
            projectId: "estacao-de-comando-loteria",
            storageBucket: "estacao-de-comando-loteria.firebasestorage.app",
            messagingSenderId: "115426303577",
            appId: "1:115426303577:web:31cfc1f3d77fde3be71b48"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 🔥 INSIRA AQUI O LINK DO SEU NOVO SITE HOSPEDADO NO GITHUB PAGES 🔥
        const LINK_PORTFOLIO = "https://leandrinho93.github.io/lmtr/";

        // Verifica o dispositivo do usuário
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        async function iniciar() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const codigoDireto = params.get('codigo');

            if (id) {
                try {
                    const snapshot = await database.ref('boloes_compartilhados/' + id).once('value');
                    const dados = snapshot.val();

                    if (dados && dados.codigo) {
                        analisarEEncaminhar(dados.codigo);
                    } else {
                        mostrarErro('Bolão não encontrado ou o link expirou (validade de 5 dias).');
                    }
                } catch(e) {
                    mostrarErro('Erro de conexão ao buscar o bolão.');
                }
            } else if (codigoDireto) {
                analisarEEncaminhar(codigoDireto);
            } else {
                mostrarErro('Nenhum bolão detectado neste link.');
            }
        }

        function analisarEEncaminhar(codigo) {
            document.getElementById('spinner').style.display = 'none';

            const titulo = document.getElementById('titulo');
            const mensagem = document.getElementById('mensagem');
            const codeBox = document.getElementById('codeBox');
            const iconTop = document.getElementById('iconTop');
            const extraButtons = document.getElementById('extraButtons');

            // Exibe o código em todas as telas por segurança
            codeBox.textContent = codigo;
            codeBox.style.display = 'block';

            if (isAndroid) {
                // FLUXO NORMAL (ANDROID)
                titulo.textContent = 'Redirecionando...';
                mensagem.innerHTML = 'Abrindo o aplicativo automaticamente.<br><br><small style="color:#71717a;">Se não abrir, baixe o app e cole o código abaixo em <strong>Menu > Importar Bolão por Código</strong>.</small>';

                const deepLink = `intent://importar?codigo=${encodeURIComponent(codigo)}#Intent;scheme=lmtr;package=com.lmtr.SorteadorDeLoteria;end`;
                const playStoreLink = "https://play.google.com/store/apps/details?id=com.lmtr.SorteadorDeLoteria";

                // Tenta abrir o app via deep link
                window.location.href = deepLink;

                // Botão visível caso o navegador bloqueie o redirecionamento automático da Play Store
                extraButtons.innerHTML = `<a href="${playStoreLink}" class="btn" style="margin-top: 15px; background: #eab308; color: #0d0d14;">Baixar na Play Store</a>`;

                // Mantém a tentativa de redirecionar automaticamente para a Play Store se o app não abrir
                setTimeout(() => {
                    if (!document.hidden) {
                        window.location.href = playStoreLink;
                    }
                }, 2500);

            } else if (isIOS) {
                // FLUXO IPHONE / IPAD
                window.location.href = LINK_PORTFOLIO;
                
                iconTop.textContent = '📱';
                iconTop.style.display = 'block';
                titulo.textContent = 'Redirecionando...';
                titulo.style.color = '#c084fc';
                mensagem.innerHTML = 'Levando você para a nossa página oficial...';
                
                extraButtons.innerHTML = `<a href="${LINK_PORTFOLIO}" class="btn">Acessar Site</a>`;

            } else {
                // FLUXO PC (DESKTOP)
                iconTop.textContent = '💻';
                iconTop.style.display = 'block';
                titulo.textContent = 'Acesse pelo Celular';
                titulo.style.color = '#60a5fa';
                mensagem.innerHTML = 'Você está no computador. Para importar este bolão, abra o aplicativo no seu <strong>celular Android</strong> e cole o código abaixo:';
                
                extraButtons.innerHTML = `<a href="${LINK_PORTFOLIO}" class="btn" target="_blank">Conhecer a LMTR</a>`;
            }
        }

        function mostrarErro(msg) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('titulo').textContent = 'Ops!';
            document.getElementById('titulo').style.color = '#ef4444';
            document.getElementById('mensagem').textContent = msg;
        }

        setTimeout(iniciar, 300);
    </script>
</body>
</html>
